packages:
  # Published CLIs, one per tool (pgdeck, later s3deck, redisdeck, ...).
  - tools/*
  # Internal shared libraries. Private and source-only: each tool bundles them.
  - packages/*
  # The shared website featuring every deck (one folder per deck inside it).
  - site
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.108.3'
  - '@tanstack/react-query@5.108.3'

# One version per shared dependency, used as "catalog:" in package.json files.
# pnpm writes the real version into a package when it is packed or published.
catalog:
  '@fontsource-variable/geist': '^5.3.0'
  '@fontsource-variable/geist-mono': '^5.3.0'
  '@hono/node-server': '^2.1.11'
  '@tailwindcss/vite': '^4.3.5'
  '@tanstack/react-query': '^5.108.3'
  '@types/node': '^26.6.6'
  '@types/react': '^19.3.0'
  '@types/react-dom': '^19.3.0'
  '@vitejs/plugin-react': '^6.3.0'
  class-variance-authority: '^0.7.1'
  clsx: '^2.1.1'
  cmdk: '^1.1.1'
  commander: '^15.1.0'
  concurrently: '^10.0.7'
  hono: '^4.13.20'
  lucide-react: '^1.77.0'
  open: '^11.0.4'
  oxlint: '^1.95.0'
  picocolors: '^1.1.1'
  radix-ui: '^1.8.1'
  react: '^19.3.1'
  react-dom: '^19.3.1'
  sonner: '^2.0.8'
  tailwind-merge: '^3.7.1'
  tailwindcss: '^4.3.5'
  tsdown: '^0.23.7'
  tsx: '^4.23.15'
  tw-animate-css: '^1.4.0'
  typescript: '^7.0.2'
  vite: '^8.3.8'
  zod: '^4.6.7'
